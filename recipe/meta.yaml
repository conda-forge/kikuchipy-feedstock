{% set name = "kikuchipy" %}
{% set version = "0.14.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}-meta
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 759c2a2f1f1aa1cc899996d8df45d7f2f37e78b0c544d2b4352440d5695c25a4

build:
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}

outputs:
  - name: {{ name }}-base
    build:
      noarch: python
      script: {{ PYTHON }} -m pip install . --no-deps -vv
    requirements:
      host:
        - python {{ python_min }}
        - hatchling
        - pip
      run:
        - python >={{ python_min }}
        - dask-core >=2021.8.1
        - diffpy.structure >=3
        - diffsims >=0.5.2
        - hyperspy-base >=2.2
        - h5py >=2.10
        - imageio
        - lazy_loader
        - matplotlib-base >=3.6
        - numba >=0.58
        - numpy >=1.25.0
        - orix-base >=0.15.0
        - packaging
        - pyyaml
        - rosettasciio-base >=0.3.0
        - scikit-image >=0.16.2
        - scikit-learn
        - scipy >=1.7
        - tqdm >=0.5.2
        # TODO: Remove once Python >= 3.11
        - typing-extensions
    test:
      # Test suite is run in package with all optional requirements
      requires:
        - python {{ python_min }}
        - pip
      source_files:
        - tests
        - conftest.py
      commands:
        - pip check

  - name: {{ name }}
    build:
      noarch: python
    requirements:
      host:
        - python {{ python_min }}
      run:
        - {{ pin_subpackage('kikuchipy-base', exact=True) }}
        - python >={{ python_min }}
        - bayesian-optimization >=3.0
        # TODO: Uncomment once ebsdsim is available from conda-forge,
        # https://github.com/ZacharyVarley/ebsdsim/issues/5
        # - ebsdsim >=0.1.4
        - ipywidgets
        - IPython
        - nlopt
        - pooch >=1.3.0
        - psygnal
        - pyebsdindex-base >=0.3.9.2,!=0.3.10
        - pyvista
    test:
      requires:
        - python {{ python_min }}
        - pip
        - pytest
        - pytest-xdist
        - pytest-rerunfailures
      source_files:
        - tests
        - conftest.py
      imports:
        - kikuchipy
        - kikuchipy.data
        - kikuchipy.detectors
        - kikuchipy.draw
        - kikuchipy.filters
        - kikuchipy.imaging
        - kikuchipy.indexing
        - kikuchipy.io
        - kikuchipy.pattern
        - kikuchipy.signals
        - kikuchipy.simulations
      commands:
        - pip check
        - pytest tests -vvv -n 2 --reruns 2 -k "not test_refine_orientation_projection_center_local_nlopt"

about:
  home: https://kikuchipy.org
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: |
    Processing, simulating, and indexing of electron backscatter diffraction (EBSD)
    patterns
  description: |
    kikuchipy is a library for processing, simulating, and indexing of electron
    backscatter diffraction (EBSD) patterns in Python. It is built on the tools for
    multi-dimensional data analysis provided by the HyperSpy library.
  doc_url: https://kikuchipy.org
  dev_url: https://github.com/pyxem/kikuchipy

extra:
  recipe-maintainers:
    - hakonanes
