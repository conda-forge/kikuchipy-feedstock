{% set name = "kikuchipy" %}
{% set version = "0.12.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}-meta
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d48fd5ea27b5b49842547ba45bca3d9a5efe04a7e9307bb1509b1e2b560c1a2c

build:
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}

outputs:
  - name: {{ name }}-base
    build:
      noarch: python
      script: {{ PYTHON }} -m pip install . --no-deps -vv
    requirements:
      host:
        - python {{ python_min }}
        - hatchling
        - pip
      run:
        - python >={{ python_min }}
        - dask-core >=2021.8.1
        - diffpy.structure >=3
        - diffsims >=0.5.2
        - hyperspy-base >=2.2
        - h5py >=2.10
        - imageio
        - matplotlib-base >=3.6
        - numba >=0.57
        - numpy >=1.23.0
        - orix-base >=0.12.1
        - pooch >=1.3.0
        - pyyaml
        - rosettasciio-base >=0.3.0
        - scikit-image >=0.16.2
        - scikit-learn
        - scipy >=1.7
        - tqdm >=0.5.2
        # TODO: Remove once Python >= 3.11
        - typing-extensions
    test:
      # Test suite is run in package with all optional requirements
      requires:
        - python {{ python_min }}
        - pip
      source_files:
        - tests
        - conftest.py
      commands:
        - pip check

  - name: {{ name }}
    build:
      noarch: python
    requirements:
      host:
        - python {{ python_min }}
      run:
        - {{ pin_subpackage('kikuchipy-base', exact=True) }}
        - python >={{ python_min }}
        - ipywidgets
        - IPython
        - nlopt
        - pyebsdindex-base >=0.3.9.2
        - psygnal
        - pyvista
    test:
      requires:
        - python {{ python_min }}
        - pip
        - pytest
        - pytest-xdist
        - pytest-rerunfailures
      source_files:
        - tests
        - conftest.py
      imports:
        - kikuchipy
        - kikuchipy.data
        - kikuchipy.detectors
        - kikuchipy.draw
        - kikuchipy.filters
        - kikuchipy.imaging
        - kikuchipy.indexing
        - kikuchipy.io
        - kikuchipy.pattern
        - kikuchipy.signals
        - kikuchipy.simulations
      commands:
        - pip check
        - pytest tests -vvv -n 2 --reruns 2 -k "not test_dataset_availability"

about:
  home: https://kikuchipy.org
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: |
    Processing, simulating, and indexing of electron backscatter diffraction (EBSD)
    patterns
  description: |
    kikuchipy is a library for processing, simulating, and indexing of electron
    backscatter diffraction (EBSD) patterns in Python, built on the tools for
    multi-dimensional data analysis provided by the HyperSpy library.
  doc_url: https://kikuchipy.org
  dev_url: https://github.com/pyxem/kikuchipy

extra:
  recipe-maintainers:
    - hakonanes
